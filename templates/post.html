<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} — {{CHANNEL}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="article:published_time" content="{{DATE_ISO}}">
<link rel="stylesheet" href="../../css/style.css?v=7">
<script type="application/ld+json">{{JSON_LD}}</script>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta property="og:site_name" content="CHAN.SU">
<meta property="og:image" content="{{OG_IMAGE}}">
{{OG_VIDEO}}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="{{OG_IMAGE}}">
</head>
<body>
<header class="site-header">
  <a href="../../" class="logo"><img src="/favicon.ico" alt="" width="20" height="20">CHAN.SU</a>
  <nav aria-label="Навигация">
    <a href="../">← {{CHANNEL}}</a>
  </nav>
</header>

<main class="post">
  <article>
    <header class="post-header">
      <div class="channel-head">
        <span class="avatar" data-letter="{{AVATAR_LETTER}}"><img src="../../photo/{{USERNAME}}.jpg" alt="" loading="lazy" onerror="this.closest('.avatar').classList.add('no-avatar')"></span>
        <span class="info">
          <span class="name">{{CHANNEL}}</span>
          <span class="handle"><span class="u">@{{USERNAME}}</span></span>
        </span>
        {{SHARE}}{{SUBSCRIBE}}
      </div>
      <h1>{{TITLE}}</h1>
      <time datetime="{{DATE_ISO}}">{{DATE}}</time>
    </header>
    {{MEDIA}}
    <div class="post-body">{{BODY}}</div>
  </article>

  <!-- навигация между постами: стрелка влево в начале, вправо в конце -->
  {{RELATED}}
</main>

<aside class="other-channels">
  <h3>Другие каналы</h3>
  {{OTHER_CHANNELS}}
</aside>

<footer class="site-footer"><span>© CHAN Social Union</span><a href="/privacy/">Конфиденциальность</a></footer>
<script src="/feed.js?v=7" defer></script>
</body>
</html>
